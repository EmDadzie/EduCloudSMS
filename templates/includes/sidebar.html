<div class="col-lg-2 col-md-3 sidebar">

    <div class="text-center mb-4">

        {% if school.logo %}

            <img src="{{ school.logo.url }}"
                 class="school-logo">

        {% else %}

            <div class="school-logo d-flex justify-content-center align-items-center">

                <i class="bi bi-building-fill"></i>

            </div>

        {% endif %}

        <h5 class="mt-3">

            {{ school.school_name }}

        </h5>

        <small>

            {{ school.motto }}

        </small>

    </div>

    <hr>

    <small class="menu-title">

        MAIN MENU

    </small>

    <a href="/dashboard/" class="nav-link">

        <i class="bi bi-speedometer2"></i>

        Dashboard

    </a>

    <a href="/admin/students/student/" class="nav-link">

        <i class="bi bi-people-fill"></i>

        Students

    </a>

    <a href="/admin/teachers/teacher/" class="nav-link">

        <i class="bi bi-person-workspace"></i>

        Teachers

    </a>

    <a href="/admin/classes/classroom/" class="nav-link">

        <i class="bi bi-building"></i>

        Classes

    </a>

    <a href="/admin/subjects/subject/" class="nav-link">

        <i class="bi bi-book-fill"></i>

        Subjects

    </a>

    <a href="/admin/attendance/attendance/" class="nav-link">

        <i class="bi bi-calendar-check-fill"></i>

        Attendance

    </a>

    <a href="/admin/assessments/score/" class="nav-link">

        <i class="bi bi-pencil-square"></i>

        Scores

    </a>

    <hr>

    <div class="small">

        <div class="d-flex justify-content-between">

            <span>Students</span>

            <strong>{{ sidebar_students }}</strong>

        </div>

        <div class="d-flex justify-content-between">

            <span>Teachers</span>

            <strong>{{ sidebar_teachers }}</strong>

        </div>

        <div class="d-flex justify-content-between">

            <span>Classes</span>

            <strong>{{ sidebar_classes }}</strong>

        </div>

    </div>

</div>
