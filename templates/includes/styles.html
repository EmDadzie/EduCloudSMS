<style>

    /* ======================================================
    ROOT VARIABLES
    ====================================================== */

    :root{

        --primary:
        {% if school.primary_color %}
            {{ school.primary_color }}
        {% else %}
            #0A2540
        {% endif %};

        --secondary:
        {% if school.secondary_color %}
            {{ school.secondary_color }}
        {% else %}
            #C9A227
        {% endif %};

        --background:#eef2f7;

        --card-radius:18px;

    }

    /* ======================================================
    GENERAL
    ====================================================== */

    body{

        background:var(--background);

        font-family:"Segoe UI",sans-serif;

        overflow-x:hidden;

    }

    .content{

        padding:30px;

    }

    /* ======================================================
    TOPBAR
    ====================================================== */

    .topbar{

        background:white;

        padding:18px 30px;

        box-shadow:0 2px 10px rgba(0,0,0,.08);

    }

    /* ======================================================
    DASHBOARD HEADER
    ====================================================== */

    .dashboard-header{

        background:white;

        border-radius:var(--card-radius);

        padding:25px;

        margin-bottom:25px;

        box-shadow:0 5px 20px rgba(0,0,0,.05);

    }

    /* ======================================================
    CARDS
    ====================================================== */

    .card{

        border:none;

        border-radius:var(--card-radius);

    }

    .card-header{

        background:white;

        font-weight:600;

    }

    /* ======================================================
    KPI CARDS
    ====================================================== */

    .stat-card{

        transition:.35s;

        position:relative;

        overflow:hidden;

    }

    .stat-card:hover{

        transform:translateY(-8px);

        box-shadow:0 18px 40px rgba(0,0,0,.15);

    }

    .stat-card::before{

        content:"";

        position:absolute;

        left:0;

        top:0;

        width:6px;

        height:100%;

        background:var(--primary);

    }

    .student-card::before{

        background:#0d6efd;

    }

    .teacher-card::before{

        background:#198754;

    }

    .class-card::before{

        background:#fd7e14;

    }

    .subject-card::before{

        background:#6f42c1;

    }

    .stat-icon{

        font-size:48px;

    }

    .students{

        color:#0d6efd;

    }

    .teachers{

        color:#198754;

    }

    .classes{

        color:#fd7e14;

    }

    .subjects{

        color:#6f42c1;

    }

    /* ======================================================
    BUTTONS
    ====================================================== */

    .btn{

        border-radius:12px;

    }

    /* ======================================================
    ANIMATIONS
    ====================================================== */

    .fade-in{

        animation:fade .5s;

    }

    @keyframes fade{

        from{

            opacity:0;

            transform:translateY(10px);

        }

        to{

            opacity:1;

            transform:translateY(0);

        }

    }

</style>
