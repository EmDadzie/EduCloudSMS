<style>

/* =====================================================
   EDUCLOUDSMS ENTERPRISE v2.0
   GLOBAL STYLES
===================================================== */

:root{

    --primary:#0A2540;
    --primary-dark:#071C30;
    --primary-light:#123B63;

    --gold:#C9A227;

    --success:#198754;
    --warning:#FFC107;
    --danger:#DC3545;
    --info:#0DCAF0;

    --bg:#F4F7FC;

    --white:#FFFFFF;

    --border:#E3E8EF;

    --sidebar-width:270px;
    --sidebar-collapse:80px;

    --topbar-height:72px;

    --shadow:0 8px 25px rgba(0,0,0,.08);

    --radius:16px;

    --transition:.3s ease;

}

/* =====================================================
   RESET
===================================================== */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

html{

    scroll-behavior:smooth;

}

body{

    background:var(--bg);

    font-family:'Inter',sans-serif;

    color:#333;

    overflow-x:hidden;

}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

    position:fixed;

    top:0;

    left:0;

    width:var(--sidebar-width);

    height:100vh;

    background:linear-gradient(
        180deg,
        var(--primary-light),
        var(--primary),
        var(--primary-dark)
    );

    color:#fff;

    overflow-y:auto;

    transition:var(--transition);

    z-index:1100;

    box-shadow:var(--shadow);

}

/* Collapse */

.sidebar.collapsed{

    width:80px;
    overflow-x:hidden;

}

/* Hide text */

.sidebar.collapsed .menu-text,

.sidebar.collapsed h3,

.sidebar.collapsed small,

.sidebar.collapsed .accordion-button::after,

.sidebar.collapsed .accordion-body,

.sidebar.collapsed .system-overview{

    display:none;

}

/* Logo */

.sidebar-header{

    padding:28px 20px;

    text-align:center;

    border-bottom:1px solid rgba(255,255,255,.08);

}

.sidebar-header img{

    width:72px;

    height:72px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid var(--gold);

    margin-bottom:12px;

}

/* =====================================================
   NAVIGATION
===================================================== */

.sidebar .nav-link{

    color:#fff;

    border-radius:10px;

    margin:4px 12px;

    transition:var(--transition);

    font-weight:500;

}

.sidebar .nav-link:hover{

    background:rgba(255,255,255,.12);

    transform:translateX(5px);

}

.sidebar .nav-link.active{

    background:#0D6EFD;

}

/* Accordion */

.accordion{

    --bs-accordion-bg:transparent;

    --bs-accordion-border-width:0;

}

.accordion-button{

    background:transparent;

    color:#fff;

    box-shadow:none;

}

.accordion-button:not(.collapsed){

    background:transparent;

    color:#fff;

}

.accordion-button:focus{

    box-shadow:none;

}

.accordion-body{

    padding-top:0;

    padding-bottom:0;

}

.accordion-body .nav-link{

    font-size:.93rem;

    margin-left:28px;

}

/* =====================================================
   PAGE WRAPPER
===================================================== */

#page-wrapper{

    margin-left:var(--sidebar-width);

    min-height:100vh;

    transition:var(--transition);

}

/* When sidebar collapses */

#page-wrapper.expanded{

    margin-left:80px;

}

/* =====================================================
   TOPBAR
===================================================== */

.topbar{

    height:var(--topbar-height);

    background:#fff;

    border-bottom:1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 30px;

    position:sticky;

    top:0;

    z-index:1000;

}

.topbar .brand{

    display:flex;

    align-items:center;

    gap:15px;

}

.topbar .brand h4{

    margin:0;

    font-weight:700;

}

.topbar-right{

    display:flex;

    align-items:center;

    gap:18px;

}

/* =====================================================
   HAMBURGER
===================================================== */

#sidebarToggle{

    width:42px;

    height:42px;

    border-radius:10px;

}

/* =====================================================
   MAIN CONTENT
===================================================== */

#main-content{

    padding:30px;

}

/* =====================================================
   CARDS
===================================================== */

.card{

    border:none;

    border-radius:var(--radius);

    box-shadow:var(--shadow);

}

.card-header{

    background:#fff;

    border-bottom:1px solid var(--border);

    font-weight:600;

}

/* =====================================================
   BUTTONS
===================================================== */

.btn{

    border-radius:10px;

}

.btn-primary{

    background:var(--primary);

    border:none;

}

.btn-primary:hover{

    background:var(--primary-light);

}

/* =====================================================
   TABLES
===================================================== */

.table{

    background:#fff;

}

.table thead{

    background:var(--primary);

    color:#fff;

}

.table td{

    vertical-align:middle;

}

/* =====================================================
   FORMS
===================================================== */

.form-control,

.form-select{

    border-radius:10px;

    border:1px solid var(--border);

    padding:10px 14px;

}

.form-control:focus,

.form-select:focus{

    border-color:#0D6EFD;

    box-shadow:none;

}

/* =====================================================
   BADGES
===================================================== */

.badge{

    border-radius:20px;

    padding:6px 12px;

}

/* =====================================================
   FOOTER
===================================================== */

.footer{

    background:#fff;

    border-top:1px solid var(--border);

    padding:18px 30px;

    color:#888;

}

/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar{

    width:8px;

}

::-webkit-scrollbar-thumb{

    background:#999;

    border-radius:20px;

}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:992px){

.sidebar{

    transform:translateX(-100%);

}

.sidebar.show{

    transform:translateX(0);

}

#page-wrapper{

    margin-left:0;

}

}

/* ==========================================
   ACCORDION MENU HOVER
========================================== */

.sidebar .accordion-button{

    color:#ffffff;
    background:transparent;
    border-radius:10px;
    margin:4px 12px;
    transition:all .25s ease;
    padding:14px 16px;
    font-weight:500;

}

.sidebar .accordion-button:hover{

    background:rgba(255,255,255,.12);
    color:#ffffff;
    transform:translateX(5px);

}

.sidebar .accordion-button:not(.collapsed){

    background:rgba(255,255,255,.15);
    color:#ffffff;
}

.sidebar .accordion-button::after{

    filter:brightness(0) invert(1);

}

</style>
