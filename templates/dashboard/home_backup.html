{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Dashboard</h2>

<div class="row g-4">

    <!-- Students Card -->
    <div class="col-md-3">
        <div class="card stat-card student-card shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted">Total Students</h6>
                        <h2>{{ total_students }}</h2>
                    </div>
                    <div class="stat-icon students">
                        <i class="bi bi-people-fill"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Teachers Card -->
    <div class="col-md-3">
        <div class="card stat-card teacher-card shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted">Total Teachers</h6>
                        <h2>{{ total_teachers }}</h2>
                    </div>
                    <div class="stat-icon teachers">
                        <i class="bi bi-person-workspace"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Classes Card -->
    <div class="col-md-3">
        <div class="card stat-card class-card shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted">Total Classes</h6>
                        <h2>{{ total_classes }}</h2>
                    </div>
                    <div class="stat-icon classes">
                        <i class="bi bi-building"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Subjects Card -->
    <div class="col-md-3">
        <div class="card stat-card subject-card shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted">Total Subjects</h6>
                        <h2>{{ total_subjects }}</h2>
                    </div>
                    <div class="stat-icon subjects">
                        <i class="bi bi-book-fill"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Quick Actions -->

<div class="card shadow mt-5">

    <div class="card-header bg-white">

        <h5 class="mb-0">

            <i class="bi bi-lightning-charge-fill text-warning"></i>

            Quick Actions

        </h5>

    </div>

    <div class="card-body">

        <div class="row g-3 text-center">

            <div class="col-md-3">
                <a href="/admin/students/student/add/" class="btn btn-primary w-100">
                    <i class="bi bi-person-plus-fill"></i>
                    Add Student
                </a>
            </div>

            <div class="col-md-3">
                <a href="/admin/teachers/teacher/add/" class="btn btn-success w-100">
                    <i class="bi bi-person-workspace"></i>
                    Add Teacher
                </a>
            </div>

            <div class="col-md-3">
                <a href="/admin/attendance/attendance/" class="btn btn-warning w-100">
                    <i class="bi bi-calendar-check-fill"></i>
                    Take Attendance
                </a>
            </div>

            <div class="col-md-3">
                <a href="/admin/assessments/score/" class="btn btn-dark w-100">
                    <i class="bi bi-pencil-square"></i>
                    Enter Scores
                </a>
            </div>

        </div>

    </div>

</div>

{% endblock %}
