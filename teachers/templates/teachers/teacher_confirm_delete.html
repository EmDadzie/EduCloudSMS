{% extends "base.html" %}

{% block title %}
Delete teacher
{% endblock %}

{% block page_title %}
<h2>
    <i class="bi bi-trash-fill text-danger"></i>
    Delete teacher
</h2>
{% endblock %}

{% block content %}

<div class="card shadow-sm border-danger">

    <div class="card-body">

        <h4 class="text-danger">
            Are you sure?
        </h4>

        <p>

            You are about to permanently delete

            <strong>

                {{ teacher.first_name }}
                {{ teacher.last_name }}

            </strong>.

        </p>

        <form method="POST">

            {% csrf_token %}

            <button class="btn btn-danger">

                <i class="bi bi-trash"></i>

                Yes, Delete

            </button>

            <a href="{% url 'teacher_detail' staff.id %}"

               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
