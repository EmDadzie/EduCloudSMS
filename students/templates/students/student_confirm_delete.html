{% extends "base.html" %}

{% block title %}
Delete Student
{% endblock %}

{% block page_title %}
<h2>
    <i class="bi bi-trash-fill text-danger"></i>
    Delete Student
</h2>
{% endblock %}

{% block content %}

<div class="card shadow-sm border-danger">

    <div class="card-body">

        <h4 class="text-danger">
            Are you sure?
        </h4>

        <p>

            You are about to permanently delete

            <strong>

                {{ student.first_name }}
                {{ student.last_name }}

            </strong>.

        </p>

        <form method="POST">

            {% csrf_token %}

            <button class="btn btn-danger">

                <i class="bi bi-trash"></i>

                Yes, Delete

            </button>

            <a href="{% url 'student_detail' student.id %}"

               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
